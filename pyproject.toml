[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "enterprise-agent-reliability-lab"
version = "1.0.1"
description = "Production-oriented reference implementation for reliable enterprise AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "mcp>=2.1,<3.0",
  "opentelemetry-api>=1.44,<2.0",
  "opentelemetry-sdk>=1.44,<2.0",
  "pydantic>=2.9,<3.0",
  "pyyaml>=6.0,<7.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0"]

[project.scripts]
after-sales-demo = "app.demo:main"
after-sales-agent = "app.agent.cli:main"
after-sales-mcp-server = "app.mcp_integration.server:main"
after-sales-mcp-demo = "app.mcp_integration.demo:main"
after-sales-skills-demo = "app.skills.demo:main"
after-sales-tracing-demo = "app.tracing.demo:main"
after-sales-eval = "app.evals.cli:main"
after-sales-benchmark = "app.benchmarks.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

