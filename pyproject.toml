[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "enterprise-agent-reliability-lab"
version = "0.3.0"
description = "Local after-sales business backend for enterprise agent reliability experiments"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "mcp>=2.1,<3.0",
  "pydantic>=2.9,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0"]

[project.scripts]
after-sales-agent = "app.agent.cli:main"
after-sales-mcp-server = "app.mcp_integration.server:main"
after-sales-mcp-demo = "app.mcp_integration.demo:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

