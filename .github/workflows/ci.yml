name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Validate installed dependencies
        run: python -m pip check

      - name: Run complete test suite
        run: python -m pytest

      - name: Validate application and package imports
        run: python -c "from app.main import app, create_app; from app.agent.runtime import AgentRuntime; from app.benchmarks import Tau3BenchmarkAdapter; from app.orchestration import MultiAgentOrchestrator; assert app.title; assert create_app(); assert AgentRuntime; assert MultiAgentOrchestrator; assert Tau3BenchmarkAdapter"

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

  container:
    name: Production container
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build production image
        run: docker build --pull --tag enterprise-agent-reliability-lab:ci .

      - name: Verify non-root runtime and application import
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' enterprise-agent-reliability-lab:ci)" = "10001:10001"
          docker run --rm enterprise-agent-reliability-lab:ci python -c "from app.main import app; assert app.title"
